<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- AppIcon.svg on the macOS icon grid: an 824 pt rounded square centred on the 1024 pt canvas, with the
     system drop shadow, so the Dock shows it at the same size as other apps. -->
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7789c"/><stop offset=".45" stop-color="#c72d62"/><stop offset="1" stop-color="#661d49"/></linearGradient>
<linearGradient id="label" x2="1" y2="1"><stop stop-color="#ffd8e2"/><stop offset="1" stop-color="#f26f96"/></linearGradient>
<radialGradient id="sheen"><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".09"/></radialGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#3a0b24" flood-opacity=".45"/></filter>
<filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
<clipPath id="shape"><rect x="100" y="100" width="824" height="824" rx="185.4"/></clipPath>
</defs>
<rect x="100" y="100" width="824" height="824" rx="185.4" fill="#661d49" filter="url(#icon-shadow)"/>
<g clip-path="url(#shape)">
<g transform="translate(100 100) scale(.8046875)">
<path fill="url(#bg)" d="M0 0h1024v1024H0z"/>
<g filter="url(#shadow)"><circle cx="502" cy="526" r="440" fill="#1d1020"/></g>
<g fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="4"><circle cx="502" cy="526" r="194"/><circle cx="502" cy="526" r="218"/><circle cx="502" cy="526" r="242"/><circle cx="502" cy="526" r="266"/><circle cx="502" cy="526" r="290"/><circle cx="502" cy="526" r="314"/><circle cx="502" cy="526" r="338"/><circle cx="502" cy="526" r="362"/><circle cx="502" cy="526" r="386"/><circle cx="502" cy="526" r="410"/></g>
<path fill="url(#sheen)" d="M502 526L615.9 101.0A440 440 0 0 1 862.4 273.6ZM502 526L388.1 951.0A440 440 0 0 1 141.6 778.4Z"/>
<circle cx="502" cy="526" r="434" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="6"/>
<circle cx="502" cy="526" r="168" fill="url(#label)"/>
<path fill="none" stroke="#661d49" stroke-linecap="round" stroke-width="28" d="M414 501v50M458 464v124M502 428v196M546 468v116M590 501v50"/>
<g filter="url(#shadow)" fill="#fff">
<path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="40" d="M874 152L856 470 786.0 664.5"/>
<rect x="728.0" y="633.5" width="116" height="62" rx="16" transform="rotate(117.8 786.0 664.5)"/>
<circle cx="874" cy="152" r="68"/>
</g>
<circle cx="874" cy="152" r="40" fill="none" stroke="#f7789c" stroke-opacity=".55" stroke-width="6"/>
<circle cx="874" cy="152" r="22" fill="#c72d62"/>
</g>
</g>
</svg>
