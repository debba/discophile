<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#100E12">
  <title>Discophile</title>
  <link data-trunk rel="rust" data-wasm-opt="z" data-bin="discophile" data-type="main" data-cargo-no-default-features />
  <link data-trunk rel="copy-file" href="assets/AppIcon.png" />
  <link rel="icon" href="AppIcon.png">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #100E12; }
    canvas#discophile { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; color: #C9C0CD; font: 15px system-ui, sans-serif; }
    #loading img { width: 92px; height: 92px; border-radius: 26px; }
  </style>
</head>
<body>
  <canvas id="discophile"></canvas>
  <div id="loading"><img src="AppIcon.png" alt=""><span>Loading Discophile…</span></div>
</body>
</html>
