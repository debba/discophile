[package]
name = "discophile"
description = "Discophile: a player for your music libraries, audiobooks and internet radio. Desktop and web."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "discophile"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "discophile"
path = "src/main.rs"

[dependencies]
discophile-core.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
chrono.workspace = true
uuid.workspace = true
rand.workspace = true
getrandom.workspace = true
futures.workspace = true
log.workspace = true
egui = { version = "0.37", features = ["experimental"] }
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11", "clipboard", "links"] }

image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
resvg = { version = "0.48", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.16"
rubato = "0.16"
souvlaki = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
directories = "6"
sys-locale = "0.3"
rfd = "0.15"
env_logger = "0.11"
notify-rust = "4"
keepawake = "0.6"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlCanvasElement", "HtmlAudioElement", "HtmlMediaElement", "HtmlInputElement",
  "Storage", "Navigator", "MediaSession", "MediaMetadata", "MediaSessionAction", "MediaSessionPlaybackState",
  "MediaSessionActionDetails", "MediaImage", "AudioContext", "BaseAudioContext", "AudioNode", "AudioParam",
  "AudioDestinationNode", "GainNode", "BiquadFilterNode", "BiquadFilterType", "MediaElementAudioSourceNode",
  "DynamicsCompressorNode", "Event", "EventTarget", "Location", "Url", "UrlSearchParams", "Blob", "File", "FileList",
  "FileReader", "TimeRanges", "MediaError", "Notification", "NotificationOptions", "NotificationPermission",
  "Cache", "CacheStorage", "Request", "Response", "console",
] }
