# Builds Discophile for macOS (universal, signed and notarized), Windows and Linux, plus the web player's container
# image and Helm chart. A pushed `v*` tag that matches the workspace version publishes a GitHub release (which the
# app offers as an update), ghcr.io/<owner>/discophile-web and oci://ghcr.io/<owner>/charts/discophile-web.
# Android APK and unsigned sideload IPA are built from the same vX.Y.Z tags in the mobile repositories.
# iOS owns the shared marketing version/build; mismatches stop every build before publication.
# Running it by hand builds the same files as workflow artifacts without publishing.
# Required mobile secrets: MOBILE_REPOS_TOKEN (read-only Contents on both private mobile repositories),
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# See docs/MOBILE_RELEASES.md. No iOS device provisioning profiles are published.
#
# macOS secrets (signing is skipped when they are missing):
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application certificate and key (.p12)
#   MACOS_CERTIFICATE_PASSWORD  password of the .p12
#   APPLE_API_KEY_P8            contents of the App Store Connect API key (AuthKey_XXXX.p8)
#   APPLE_API_KEY_ID, APPLE_API_ISSUER_ID
#
# AUR (discophile-bin is updated only when the repository is public and these are set):
#   AUR_SSH_PRIVATE_KEY         private key of an SSH key added to the AUR account
#   AUR_USERNAME, AUR_EMAIL     author of the AUR commits
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mobile_ref:
        description: Matching branch or tag in both mobile repositories (manual builds never publish)
        default: main
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version || steps.local_version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      ios_sha: ${{ steps.sources.outputs.ios_sha }}
      android_sha: ${{ steps.sources.outputs.android_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Require mobile repository access and stable Android signing
        if: vars.DISCOPHILE_LOCAL_MOBILE != 'true'
        env:
          MOBILE_REPOS_TOKEN: ${{ secrets.MOBILE_REPOS_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for key in MOBILE_REPOS_TOKEN ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!key}" ]] || { echo "::error::Missing secret $key; see docs/MOBILE_RELEASES.md"; exit 1; }
          done
      - uses: actions/checkout@v4
        if: vars.DISCOPHILE_LOCAL_MOBILE != 'true'
        with:
          repository: debba/discophile-ios
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.mobile_ref }}
          token: ${{ secrets.MOBILE_REPOS_TOKEN }}
          persist-credentials: false
          path: .mobile/ios
      - uses: actions/checkout@v4
        if: vars.DISCOPHILE_LOCAL_MOBILE != 'true'
        with:
          repository: debba/discophile-android
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.mobile_ref }}
          token: ${{ secrets.MOBILE_REPOS_TOKEN }}
          persist-credentials: false
          path: .mobile/android
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests
      - id: version
        name: Check all versions against iOS
        if: vars.DISCOPHILE_LOCAL_MOBILE != 'true'
        run: |
          tag=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag=(--tag "$GITHUB_REF_NAME"); fi
          python3 scripts/release-version.py --ios-root .mobile/ios --android-root .mobile/android \
            --github-output "$GITHUB_OUTPUT" "${tag[@]}"
      - id: local_version
        name: Check desktop version for locally built mobile assets
        if: vars.DISCOPHILE_LOCAL_MOBILE == 'true'
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Tag does not match desktop version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - id: sources
        name: Freeze source commits and record provenance
        if: vars.DISCOPHILE_LOCAL_MOBILE != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def sha(path):
              return subprocess.check_output(['git', '-C', path, 'rev-parse', 'HEAD'], text=True).strip()
          ios, android = sha('.mobile/ios'), sha('.mobile/android')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ios_sha={ios}\nandroid_sha={android}\n')
          sources = {'version': os.environ['VERSION'], 'build': int(os.environ['BUILD']),
                     'desktop': sha('.'), 'ios': ios, 'android': android}
          Path('dist/RELEASE-SOURCES.json').write_text(json.dumps(sources, indent=2) + '\n')
          PY
          cp packaging/mobile/INSTALLATION.md dist/MOBILE-INSTALLATION.md
      - uses: actions/upload-artifact@v4
        if: vars.DISCOPHILE_LOCAL_MOBILE != 'true'
        with:
          name: sources
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --release --locked -p discophile --target aarch64-apple-darwin
          cargo build --release --locked -p discophile --target x86_64-apple-darwin
          lipo -create -output target/Discophile \
            target/aarch64-apple-darwin/release/Discophile target/x86_64-apple-darwin/release/Discophile
      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # Keeps the existing keychains in the search list, one argument each.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Prepare the notary key
        if: env.APPLE_API_KEY_P8 != ''
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_KEY_ID=$APPLE_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$APPLE_API_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Package
        run: scripts/package-macos.sh target/Discophile "$VERSION" dist universal
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  android:
    if: vars.DISCOPHILE_LOCAL_MOBILE != 'true'
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: debba/discophile-android
          ref: ${{ needs.version.outputs.android_sha }}
          token: ${{ secrets.MOBILE_REPOS_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'release-signing.keystore'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ANDROID_KEYSTORE_PATH={path}\n')
          PY
      - name: Test and build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleRelease --no-daemon --max-workers=2
      - name: Verify signature and embedded version
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          python3 - <<'PY'
          import os, subprocess
          aapt = os.environ['ANDROID_HOME'] + '/build-tools/35.0.0/aapt'
          package = subprocess.check_output([aapt, 'dump', 'badging', 'app/build/outputs/apk/release/app-release.apk'], text=True).splitlines()[0]
          assert "name='it.discophile.android'" in package, 'Wrong APK application ID'
          assert f"versionName='{os.environ['VERSION']}'" in package, 'Wrong APK version'
          assert f"versionCode='{os.environ['BUILD']}'" in package, 'Wrong APK build'
          PY
          mkdir -p dist
          cp "$apk" "dist/Discophile-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release-signing.keystore"

  ios:
    if: vars.DISCOPHILE_LOCAL_MOBILE != 'true'
    needs: version
    # The app uses the iOS 27 SDK; the normal macOS image still defaults to Xcode 26.
    runs-on: xcode-27
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: debba/discophile-ios
          ref: ${{ needs.version.outputs.ios_sha }}
          token: ${{ secrets.MOBILE_REPOS_TOKEN }}
          persist-credentials: false
          path: .mobile/ios
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build public sideload IPA without device profiles
        run: bash scripts/package-ios.sh .mobile/ios "$VERSION" "$BUILD" dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p discophile
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Discophile | Out-Null
          Copy-Item target/release/Discophile.exe dist/Discophile/
          Compress-Archive -Path dist/Discophile -DestinationPath "dist/Discophile-$env:VERSION-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    needs: version
    # The oldest supported runner, so the binary runs on older glibc versions too.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libdbus-1-dev dpkg-dev desktop-file-utils libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libxinerama1 libegl1 libgl1-mesa-dri xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p discophile
      - name: Package
        run: scripts/package-linux.sh target/release/Discophile "$VERSION" dist
      - name: Verify Linux packages
        run: |
          desktop-file-validate packaging/linux/discophile.desktop
          dpkg-deb --info "dist/discophile_${VERSION}_amd64.deb"
          sudo apt-get install -y "./dist/discophile_${VERSION}_amd64.deb"
          # Exercise both package launchers with a software-rendered display.
          verify_launch() {
            set +e
            timeout 15s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$@" > "$RUNNER_TEMP/linux-launch.log" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/linux-launch.log"
            [[ $result == 124 ]] || { echo "::error::GUI exited early ($result)"; exit 1; }
          }
          verify_launch /usr/bin/discophile
          image=$(realpath "dist/Discophile-$VERSION-x86_64.AppImage")
          mkdir "$RUNNER_TEMP/appimage-check"
          (cd "$RUNNER_TEMP/appimage-check" && "$image" --appimage-extract >/dev/null)
          verify_launch "$RUNNER_TEMP/appimage-check/squashfs-root/AppRun"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage

  web-image:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/discophile-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha
      - uses: docker/build-push-action@v6
        env:
          # The build record artifact breaks the release job's artifact download.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-chart:
    needs: [version, web-image]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package
        run: |
          helm lint deploy/helm/discophile-web
          helm package deploy/helm/discophile-web --version "$VERSION" --app-version "$VERSION" -d dist
      - name: Push
        if: github.ref_type == 'tag'
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/discophile-web-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - uses: actions/upload-artifact@v4
        with:
          name: helm
          path: dist/*.tgz

  release:
    if: github.ref_type == 'tag' && vars.DISCOPHILE_LOCAL_MOBILE != 'true'
    needs: [version, macos, windows, linux, helm-chart, android, ios]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{macos,windows,linux,helm,android,ios,sources}"
          merge-multiple: true
      - name: Publish only the complete release
        run: |
          for file in "Discophile-$VERSION-macos-universal.dmg" "Discophile-$VERSION-windows-x86_64.zip" \
            "Discophile-$VERSION-linux-x86_64.tar.gz" "discophile_${VERSION}_amd64.deb" \
            "Discophile-$VERSION-x86_64.AppImage" "discophile-web-$VERSION.tgz" \
            "Discophile-$VERSION-android.apk" "Discophile-$VERSION-ios-unsigned.ipa" \
            RELEASE-SOURCES.json MOBILE-INSTALLATION.md; do
            [[ -s "dist/$file" ]] || { echo "::error::Missing release asset: $file"; exit 1; }
          done
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          notes=(--generate-notes)
          if [[ -f "docs/releases/$VERSION.md" ]]; then
            notes+=(--notes-file "docs/releases/$VERSION.md")
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Discophile $VERSION" "${notes[@]}" --verify-tag
          gh release edit "$GITHUB_REF_NAME" --draft=false

  aur:
    if: github.ref_type == 'tag' && !github.event.repository.private
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.AUR_SSH_PRIVATE_KEY != ''
      - uses: actions/download-artifact@v4
        if: env.AUR_SSH_PRIVATE_KEY != ''
        with:
          name: linux
          path: dist
      - name: Update the PKGBUILD
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          sum=$(sha256sum "dist/Discophile-$VERSION-linux-x86_64.tar.gz" | cut -d' ' -f1)
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/aur/discophile-bin/PKGBUILD
      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        if: env.AUR_SSH_PRIVATE_KEY != ''
        with:
          pkgname: discophile-bin
          pkgbuild: packaging/aur/discophile-bin/PKGBUILD
          test: true
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ env.VERSION }}
