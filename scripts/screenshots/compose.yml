# Demo servers for the README screenshots. Synthetic accounts only; data lives in ../../.screenshots.
services:
  navidrome:
    image: deluan/navidrome:0.64.2
    ports: ["4542:4533"]
    environment:
      ND_SCANSCHEDULE: "0"
      ND_DEVAUTOCREATEADMINPASSWORD: demo-screens
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
    volumes: ["../../.screenshots/navidrome:/data", "../../.screenshots/library/music:/music:ro"]
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.1
    ports: ["13382:80"]
    volumes:
      - ../../.screenshots/library/audiobooks:/audiobooks:ro
      - ../../.screenshots/abs/config:/config
      - ../../.screenshots/abs/metadata:/metadata
