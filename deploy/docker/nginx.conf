# Paths without query strings: Subsonic requests carry a reusable token and salt there.
log_format discophile '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /dev/stdout discophile;
    root /usr/share/nginx/html;

    gzip_static on;
    gzip on;
    gzip_types application/javascript application/wasm text/css image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The page and the bootstrap names change on every build; the hashed files never do.
    location = /index.html {
        include /etc/nginx/discophile-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(wasm|js)$ {
        include /etc/nginx/discophile-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        include /etc/nginx/discophile-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # IPv6 when available, and same-origin proxies to your servers from DISCOPHILE_PROXY_*, written at startup.
    include /etc/nginx/discophile/*.conf;
}
