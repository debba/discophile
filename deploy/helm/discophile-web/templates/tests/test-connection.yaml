apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "discophile-web.fullname" . }}-test-connection"
  labels:
    {{- include "discophile-web.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget", "-q", "-O", "-", "http://{{ include "discophile-web.fullname" . }}:{{ .Values.service.port }}/healthz"]
