# Default values for discophile-web.

replicaCount: 1

image:
  repository: ghcr.io/debba/discophile-web
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Same-origin proxies to your servers, served at /proxy/<name>/ on the player's own address. The browser then
# reaches them without CORS or mixed content: add the library in Discophile as https://<your host>/proxy/<name>.
# Names use lowercase letters, digits and dashes; addresses must be reachable from the pod.
proxies: {}
  # navidrome: http://navidrome.media.svc.cluster.local:4533
  # audiobookshelf: http://audiobookshelf.media.svc.cluster.local

# Extra environment variables for the container.
extraEnv: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: discophile.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: discophile-tls
  #    hosts:
  #      - discophile.example.com

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
